<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalcomFlix Admin</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

/* BACKGROUND VIDEO */
.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* FALLBACK IMAGE (MOBILE) */
.bg-image {
  position: fixed;
  inset: 0;
  background: url("assets/images/background.jpg") center/cover no-repeat;
  z-index: -3;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.78);
  z-index: -1;
}

body {
  color: white;
}

/* HEADER */
header {
  padding: 20px 40px;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.logo span {
  color: red;
}

/* CONTENT */
.container {
  padding: 40px;
}

.card {
  background: rgba(26,26,26,0.95);
  padding: 25px;
  border-radius: 10px;
  margin-bottom: 30px;
}

.card h2 {
  margin-bottom: 15px;
}

/* INPUTS */
#loginBox input,
.card input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: none;
  border-radius: 5px;
}

/* BUTTONS */
button {
  padding: 10px 20px;
  background: red;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 4px;
}

button:hover {
  opacity: 0.9;
}

.delete {
  background: #ff3333;
}

/* MOVIE LIST */
.movie-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #333;
}

/* HIDDEN */
.hidden {
  display: none;
}

/* MOBILE OPTIMIZATION */
@media (max-width: 768px) {
  .video-bg {
    display: none;
  }
}
</style>
</head>

<body>

<!-- FALLBACK IMAGE -->
<div class="bg-image"></div>

<!-- BACKGROUND VIDEO -->
<video id="bgVideo" class="video-bg" autoplay muted loop playsinline></video>
<div class="overlay"></div>

<header>
  <div class="logo">Malcom<span>Flix</span> Admin</div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div id="loginBox" class="card">
    <h2>🔐 Admin Login</h2>
    <input type="password" id="adminPin" placeholder="Enter Admin PIN">
    <button onclick="login()">Login</button>
  </div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <h2>👤 Subscription Control</h2>
      <button onclick="unlockUser()">Unlock Subscription</button>
      <button onclick="lockUser()">Lock Subscription</button>
    </div>

    <div class="card">
      <h2>🎬 Add Movie</h2>
      <input id="movieTitle" placeholder="Movie Title">
      <input id="movieImage" placeholder="Image Path (assets/images/...)">
      <input id="movieVideo" placeholder="Video Path (assets/videos/...)">
      <button onclick="addMovie()">Add Movie</button>
    </div>

    <div class="card">
      <h2>📽 Movie List</h2>
      <div id="movieList"></div>
    </div>

  </div>
</div>

<script>
/* RANDOM BACKGROUND VIDEOS */
const bgVideos = [
  "assets/videos/bg1.mp4",
  "assets/videos/bg2.mp4",
  "assets/videos/bg3.mp4"
];

const bgVideo = document.getElementById("bgVideo");
const randomVideo = bgVideos[Math.floor(Math.random() * bgVideos.length)];
bgVideo.src = randomVideo;

/* ADMIN LOGIC */
const ADMIN_PIN = "1234";

function login() {
  if (adminPin.value === ADMIN_PIN) {
    localStorage.setItem("admin_logged", "true");
    showDashboard();
  } else {
    alert("❌ Wrong PIN");
  }
}

function logout() {
  localStorage.removeItem("admin_logged");
  location.reload();
}

function showDashboard() {
  loginBox.style.display = "none";
  dashboard.classList.remove("hidden");
  loadMovies();
}

if (localStorage.getItem("admin_logged") === "true") {
  showDashboard();
}

/* SUBSCRIPTION */
function unlockUser() {
  localStorage.setItem("malcomflix_subscribed", "true");
  alert("✅ User subscription unlocked");
}

function lockUser() {
  localStorage.removeItem("malcomflix_subscribed");
  alert("🔒 User subscription locked");
}

/* MOVIES */
function getMovies() {
  return JSON.parse(localStorage.getItem("movies")) || [];
}

function saveMovies(movies) {
  localStorage.setItem("movies", JSON.stringify(movies));
}

function addMovie() {
  if (!movieTitle.value || !movieImage.value || !movieVideo.value) {
    alert("⚠️ Fill all fields");
    return;
  }

  const movies = getMovies();
  movies.push({
    title: movieTitle.value,
    image: movieImage.value,
    video: movieVideo.value
  });

  saveMovies(movies);
  movieTitle.value = movieImage.value = movieVideo.value = "";
  loadMovies();
}

function deleteMovie(index) {
  const movies = getMovies();
  movies.splice(index, 1);
  saveMovies(movies);
  loadMovies();
}

function loadMovies() {
  movieList.innerHTML = "";
  getMovies().forEach((movie, i) => {
    movieList.innerHTML += `
      <div class="movie-item">
        <span>${movie.title}</span>
        <button class="delete" onclick="deleteMovie(${i})">Delete</button>
      </div>
    `;
  });
}
</script>

</body>
</html>
